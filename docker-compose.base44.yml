services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

volumes:
  node_modules:
