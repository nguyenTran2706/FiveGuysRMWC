services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
      - RIGHTS_API_URL=http://api:8787
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: node --watch api/server.mjs
    volumes:
      - ./:/app
    expose:
      - "8787"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

volumes:
  node_modules:
