services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
      - RIGHTS_API_URL=http://api:8787
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: node --watch scripts/rights-api.mjs
    volumes:
      - ./:/app
    expose:
      - "8787"
    environment:
      - MODEL_URL=http://model:8080/v1/chat/completions
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

  # Self-hosted open-weights FAQ model (Hugging Face GGUF, no external API or token).
  model:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8080 --ctx-size 4096 --threads 4
    volumes:
      - model_cache:/root/.cache/llama.cpp
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

volumes:
  node_modules:
  model_cache:
